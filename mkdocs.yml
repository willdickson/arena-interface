site_name: arena-interface
site_description: Python host library for the G6 arena controller
site_url: https://willdickson.github.io/arena-interface/
repo_url: https://github.com/willdickson/arena-interface
repo_name: willdickson/arena-interface
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_symbol_type_heading: true
            filters: ["!^_"]
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
not_in_nav: |
  /PLAN.md
  /SPEC.md
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide: user-guide.md
  - Examples: examples.md
  - Protocol reference: PROTOCOL.md
  - API reference: api.md
